<style>
/* ── Tokens ──────────────────────────────────────────── */
:root {
  --bg:        #f3ede1;
  --sidebar:   #e9e1d4;
  --hdr:       #8c1c1c;
  --hdr-t:     #fff;
  --text:      #1d1811;
  --text2:     #887060;
  --text3:     #b8a890;
  --red:       #8c1c1c;
  --red-h:     #a82020;
  --border:    #c8bfae;
  --hover:     #dfd7ca;
  --bq:        #e4dbd0;
  --fn:        #e0d9ce;
  --shadow:    rgba(0,0,0,.13);
  --rdg-sz:    17px;
  --sw:        256px;
  --sh:        52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #141110;
    --sidebar: #0e0c0a;
    --hdr:     #0a0807;
    --hdr-t:   #e0d4c0;
    --text:    #dfd3bf;
    --text2:   #8a7a68;
    --text3:   #5a4e42;
    --red:     #c03030;
    --red-h:   #d44040;
    --border:  #2a2420;
    --hover:   #1c1815;
    --bq:      #1a1714;
    --fn:      #181410;
    --shadow:  rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:      #141110;
  --sidebar: #0e0c0a;
  --hdr:     #0a0807;
  --hdr-t:   #e0d4c0;
  --text:    #dfd3bf;
  --text2:   #8a7a68;
  --text3:   #5a4e42;
  --red:     #c03030;
  --red-h:   #d44040;
  --border:  #2a2420;
  --hover:   #1c1815;
  --bq:      #1a1714;
  --fn:      #181410;
  --shadow:  rgba(0,0,0,.5);
}

/* ── Reset ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background .25s, color .25s;
}
button { font-family: inherit; cursor: pointer; }

/* ── Header ─────────────────────────────────────────── */
.hdr {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--sh);
  background: var(--hdr);
  color: var(--hdr-t);
  display: flex; align-items: center;
  padding: 0 14px;
  z-index: 200;
  box-shadow: 0 1px 8px var(--shadow);
  gap: 10px;
}
.hdr-tog {
  display: none;
  background: rgba(255,255,255,.12);
  border: none;
  color: var(--hdr-t);
  width: 36px; height: 36px;
  border-radius: 5px;
  font-size: 18px;
  align-items: center; justify-content: center;
}
.hdr-tog:hover { background: rgba(255,255,255,.22); }
.hdr-brand { display: flex; align-items: center; gap: 10px; }
.hdr-star {
  font-size: 22px; line-height: 1; opacity: .85;
  text-shadow: 0 0 12px rgba(255,200,0,.4);
}
.hdr-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px; font-weight: 700;
  letter-spacing: .1em;
}
.hdr-sub {
  font-size: 11px;
  opacity: .6;
  margin-top: 1px;
  letter-spacing: .05em;
}
.hdr-gap { flex: 1; }
.hdr-ctrls { display: flex; align-items: center; gap: 6px; }

.fgrp {
  display: flex; align-items: center;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 5px; overflow: hidden;
}
.fgrp button {
  background: none; border: none;
  color: var(--hdr-t);
  padding: 5px 9px; font-size: 12px;
  transition: background .15s; opacity: .8;
}
.fgrp button:hover { background: rgba(255,255,255,.2); opacity: 1; }

.theme-b {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.18);
  color: var(--hdr-t);
  padding: 5px 12px; border-radius: 5px;
  font-size: 12px;
  transition: background .15s;
  white-space: nowrap;
}
.theme-b:hover { background: rgba(255,255,255,.2); }

/* ── Sidebar ────────────────────────────────────────── */
.sidebar {
  position: fixed;
  top: var(--sh); left: 0;
  width: var(--sw);
  height: calc(100vh - var(--sh));
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 150;
  transition: transform .28s cubic-bezier(.4,0,.2,1), background .25s;
}

.s-search {
  padding: 10px 10px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.s-input {
  width: 100%;
  padding: 7px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 13px; color: var(--text);
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.s-input::placeholder { color: var(--text3); }
.s-input:focus { border-color: var(--red); }

.s-stat {
  padding: 7px 12px;
  font-size: 11px; color: var(--text2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.s-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.s-fill { height: 100%; background: var(--red); border-radius: 2px; transition: width .4s; }

.s-scroll {
  overflow-y: auto; flex: 1;
  padding: 4px 0 24px;
}
.s-scroll::-webkit-scrollbar { width: 3px; }
.s-scroll::-webkit-scrollbar-track { background: transparent; }
.s-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Volume */
.vol-hdr {
  display: flex; align-items: flex-start;
  padding: 9px 10px;
  cursor: pointer; gap: 7px;
  transition: background .12s;
  user-select: none;
}
.vol-hdr:hover { background: var(--hover); }
.vol-arr {
  font-size: 8px; color: var(--text3);
  margin-top: 5px; flex-shrink: 0;
  transition: transform .2s;
}
.vol-item.open .vol-arr { transform: rotate(90deg); }
.vol-badge {
  font-size: 10px; font-weight: 600;
  background: var(--red); color: #fff;
  padding: 2px 7px; border-radius: 3px;
  flex-shrink: 0; margin-top: 2px;
}
.vol-title {
  font-size: 12.5px; font-weight: 600;
  line-height: 1.5; color: var(--text); flex: 1;
}
.vol-body { display: none; }
.vol-item.open .vol-body { display: block; }

/* Section label */
.sec-lbl {
  padding: 6px 10px 4px 22px;
  font-size: 10.5px; font-weight: 600;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  margin-top: 3px;
  letter-spacing: .05em;
}

/* Article link */
.art {
  display: flex; align-items: baseline;
  padding: 5px 10px 5px 16px;
  font-size: 12.5px; color: var(--text2);
  cursor: pointer; gap: 7px;
  line-height: 1.5;
  transition: background .1s, color .1s;
}
.art:hover { background: var(--hover); color: var(--text); }
.art.active { background: var(--red); color: #fff; font-weight: 500; }
.art.read:not(.active) { color: var(--text3); }
.art-n {
  font-size: 10px; flex-shrink: 0;
  opacity: .45;
  font-variant-numeric: tabular-nums;
  min-width: 22px;
}
.art-ck {
  font-size: 9px; color: var(--red);
  flex-shrink: 0; margin-left: auto;
  display: none;
}
.art.read:not(.active) .art-ck { display: block; }

/* ── Overlay (mobile) ───────────────────────────────── */
.ovl {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 140;
}
.ovl.on { display: block; }

/* ── Main ───────────────────────────────────────────── */
.main {
  margin-left: var(--sw);
  margin-top: var(--sh);
  height: calc(100vh - var(--sh));
  overflow-y: auto;
  transition: margin-left .28s;
}
.main::-webkit-scrollbar { width: 5px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.rdbar { position: sticky; top: 0; height: 2px; background: rgba(140,28,28,.15); z-index: 10; }
.rdfil { height: 100%; background: var(--red); width: 0; transition: width .08s linear; }

/* Article container */
.art-wrap { max-width: 720px; margin: 0 auto; padding: 44px 56px 80px; }

/* ── Prose ──────────────────────────────────────────── */
.prose {
  font-family: 'Noto Serif SC', 'SimSun', '宋体', Georgia, serif;
  font-size: var(--rdg-sz);
  line-height: 2.05;
  color: var(--text);
}
.prose h1 {
  font-size: 1.55em; font-weight: 700;
  line-height: 1.45; margin-bottom: .25em;
  font-family: 'Noto Serif SC', serif;
  letter-spacing: .03em;
  text-wrap: balance;
}
.prose h2 {
  font-size: 1.15em; font-weight: 600;
  margin-top: 2.2em; margin-bottom: .7em;
  padding-bottom: .3em;
  border-bottom: 1px solid var(--border);
  text-wrap: balance;
}
.prose h3 {
  font-size: 1.05em; font-weight: 600;
  margin-top: 1.8em; margin-bottom: .5em;
  text-wrap: balance;
}
.prose p { margin-bottom: 1em; text-indent: 2em; }
.prose h1 + p {
  text-indent: 0; color: var(--text2);
  font-size: .9em; margin-bottom: 1.4em;
}
.prose h2 + p,
.prose h3 + p,
.prose blockquote + p { text-indent: 0; }
.prose blockquote {
  background: var(--bq);
  border-left: 3px solid var(--red);
  padding: 10px 15px;
  margin: 1.2em 0 1.4em;
  border-radius: 0 5px 5px 0;
  font-size: .88em; color: var(--text2);
}
.prose blockquote p { text-indent: 0; margin-bottom: .5em; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose .footnotes {
  margin-top: 2.5em; padding-top: 1.5em;
  border-top: 1px solid var(--border);
  font-size: .83em; color: var(--text2); line-height: 1.9;
}
.prose .footnotes p { text-indent: 0; margin-bottom: .7em; }
.prose strong { font-weight: 700; }
.prose em { font-style: normal; color: var(--text2); }
.prose ul, .prose ol { padding-left: 2em; margin-bottom: 1em; }
.prose li { margin-bottom: .4em; }

.noart {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 50vh; text-align: center;
  color: var(--text2);
}
.noart-star { font-size: 48px; opacity: .15; margin-bottom: 16px; }
.noart-h { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--text); margin-bottom: 8px; }
.noart-p { font-size: 13px; line-height: 2; }
.noart-cmd {
  margin-top: 16px;
  display: inline-block;
  background: var(--sidebar);
  border: 1px solid var(--border);
  padding: 6px 14px; border-radius: 5px;
  font-size: 12px; font-family: 'Courier New', monospace;
  color: var(--text2); letter-spacing: .03em;
}

/* ── Article nav ────────────────────────────────────── */
.art-nav {
  display: flex; justify-content: space-between;
  margin-top: 44px; padding-top: 20px;
  border-top: 1px solid var(--border);
  gap: 12px;
}
.nav-b {
  display: flex; flex-direction: column; justify-content: center;
  padding: 10px 14px;
  background: var(--sidebar);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text2); font-size: 13px;
  transition: all .15s; max-width: 46%;
  line-height: 1.5;
}
.nav-b.nr { text-align: right; }
.nav-b:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }
.nav-b:disabled { opacity: .3; cursor: not-allowed; }
.nav-lbl { font-size: 10px; opacity: .7; display: block; margin-bottom: 2px; }
.nav-ttl { font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: none; box-shadow: 4px 0 24px var(--shadow); }
  .main { margin-left: 0; }
  .hdr-tog { display: flex; }
  .art-wrap { padding: 28px 20px 60px; }
  .hdr-sub { display: none; }
}
@media (max-width: 480px) {
  .fgrp { display: none; }
  .nav-ttl { max-width: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

21: `# 反对自由主义
（一九三七年九月七日）

我们主张积极的思想斗争，因为它是达到党内和革命团体内的团结使之利于战斗的武器。每个共产党员和革命分子，应该拿起这个武器。

但是自由主义取消思想斗争，主张无原则的和平，结果是腐朽庸俗的作风发生，使党和革命团体的某些组织和某些个人在政治上腐化起来。

自由主义有各种表现。

因为是熟人、同乡、同学、知心朋友、亲爱者、老同事、老部下，明知不对，也不同他们作原则上的争论，任其下去，求得和平和亲热。或者轻描淡写地说一顿，不作彻底解决，保持一团和气。结果是有害于团体，也有害于个人。这是第一种。

不负责任的背后批评，不是积极地向组织建议。当面不说，背后乱说；开会不说，会后乱说。心目中没有集体生活的原则，只有自由放任。这是第二种。

事不关己，高高挂起；明知不对，少说为佳；明哲保身，但求无过。这是第三种。

命令不服从，个人意见第一。只要组织照顾，不要组织纪律。这是第四种。

不是为了团结，为了进步，为了把事情弄好，向不正确的意见斗争和争论，而是个人攻击，闹意气，泄私愤，图报复。这是第五种。

听了不正确的议论也不争辩，甚至听了反革命分子的话也不报告，泰然处之，行若无事。这是第六种。

见群众不宣传，不鼓动，不演说，不调查，不询问，不关心其痛痒，漠然置之，忘记了自己是一个共产党员，把一个共产党员混同于一个普通的老百姓。这是第七种。

见损害群众利益的行为不愤恨，不劝告，不制止，不解释，听之任之。这是第八种。

办事不认真，无一定计划，无一定方向，敷衍了事，得过且过，做一天和尚撞一天钟。这是第九种。

自以为对革命有功，摆老资格，大事做不来，小事又不做，工作随便，学习松懈。这是第十种。

自己错了，也已经懂得，又不想改正，自己对自己采取自由主义。这是第十一种。

还可以举出一些。主要的有这十一种。

所有这些，都是自由主义的表现。

革命的集体组织中的自由主义是十分有害的。它是一种腐蚀剂，使团结涣散，关系松懈，工作消极，意见分歧。它使革命队伍失掉严密的组织和纪律，政策不能贯彻到底，党的组织和党所领导的群众发生隔离。这是一种严重的恶劣倾向。

自由主义的来源，在于小资产阶级的自私自利性，以个人利益放在第一位，革命利益放在第二位，因此产生思想上、政治上、组织上的自由主义。

自由主义者以抽象的教条看待马克思主义的原则。他们赞成马克思主义，但是不准备实行之，或不准备完全实行之，不准备拿马克思主义代替自己的自由主义。这些人，马克思主义是有的，自由主义也是有的：说的是马克思主义，行的是自由主义；对人是马克思主义，对己是自由主义。两样货色齐备，各有各的用处。这是一部分人的思想方法。

自由主义是机会主义的一种表现，是和马克思主义根本冲突的。它是消极的东西，客观上起着援助敌人的作用，因此敌人是欢迎我们内部保存自由主义的。自由主义的性质如此，革命队伍中不应该保留它的地位。

我们要用马克思主义的积极精神，克服消极的自由主义。一个共产党员，应该是襟怀坦白，忠实，积极，以革命利益为第一生命，以个人利益服从革命利益；无论何时何地，坚持正确的原则，同一切不正确的思想和行为作不疲倦的斗争，用以巩固党的集体生活，巩固党和群众的联系；关心党和群众比关心个人为重，关心他人比关心自己为重。这样才算得一个共产党员。

一切忠诚、坦白、积极、正直的共产党员团结起来，反对一部分人的自由主义的倾向，使他们改变到正确的方面来。这是思想战线的任务之一。`,

77: `# 为人民服务
（一九四四年九月八日）

> 这是毛泽东在中共中央警备团追悼张思德的会上的讲演。

我们的共产党和共产党所领导的八路军、新四军，是革命的队伍。我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。张思德同志就是我们这个队伍中的一个同志。

人总是要死的，但死的意义有不同。中国古时候有个文学家叫做司马迁的说过："人固有一死，或重于泰山，或轻于鸿毛。"为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻。张思德同志是为人民利益而死的，他的死是比泰山还要重的。

因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。不管是什么人，谁向我们指出都行。只要你说得对，我们就改正。你说的办法对人民有好处，我们就照你的办。"精兵简政"这一条意见，就是党外人士李鼎铭先生提出来的；他提得好，对人民有好处，我们就采用了。只要我们为人民的利益坚持好的，为人民的利益改正错的，我们这个队伍就一定会兴旺起来。

我们都是来自五湖四海，为了一个共同的革命目标，走到一起来了。我们还要和全国大多数人民走这一条路。我们今天已经领导着有九千一百万人口的根据地，但是还不够，还要更大些，才能取得全民族的解放。我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。中国人民正在受难，我们有责任解救他们，我们要努力奋斗。要奋斗就会有牺牲，死人的事是经常发生的。但是我们想到人民的利益，想到大多数人民的痛苦，我们为人民而死，就是死得其所。不过，我们应当尽量地减少那些不必要的牺牲。我们的干部要关心每一个战士，一切革命队伍的人都要互相关心，互相爱护，互相帮助。

今后我们的队伍里，不管死了谁，不管是炊事员，是战士，只要他是做过一些有益的工作的，我们都要给他送葬，开追悼会。这要成为一个制度。这个方法也要介绍到老百姓那里去。村上的人死了，开个追悼会。用这样的方法，寄托我们的哀思，使整个人民团结起来。

// ── State ─────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });
let flatList = [];
let curId    = null;
let fontSize = +localStorage.getItem('fz') || 17;
let readSet  = new Set(JSON.parse(localStorage.getItem('rd') || '[]'));

function applyFz(sz) {
  document.documentElement.style.setProperty('--rdg-sz', sz + 'px');
}
applyFz(fontSize);

const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀ 日间' : '🌙 夜间';
}

// ── Build flat list ───────────────────────────────────
function buildFlat() {
  flatList = [];
  TOC_DATA.forEach(vol => {
    (vol.sections || []).forEach(sec =>
      (sec.articles || []).forEach(a => flatList.push(a))
    );
    (vol.articles || []).forEach(a => flatList.push(a));
  });
}

// ── Render TOC ────────────────────────────────────────
function renderToc(q = '') {
  const tocEl = document.getElementById('toc');
  const ql = q.toLowerCase();
  let html = '';

  TOC_DATA.forEach((vol, vi) => {
    const allArts = [];
    (vol.sections || []).forEach(sec =>
      (sec.articles || []).forEach(a => allArts.push({ ...a, sec: sec.name }))
    );
    (vol.articles || []).forEach(a => allArts.push(a));

    const matched = q
      ? allArts.filter(a => a.title.toLowerCase().includes(ql) || vol.name.toLowerCase().includes(ql))
      : allArts;

    if (q && !matched.length) return;

    const isOpen = !q
      ? (vi === 0 || matched.some(a => a.id === curId))
      : true;

    html += `<div class="vol-item${isOpen ? ' open' : ''}" data-vi="${vi}">`;
    html += `<div class="vol-hdr" onclick="toggleVol(${vi})">
      <span class="vol-arr">▶</span>
      <span class="vol-badge">卷${String(vi + 1).padStart(2, '0')}</span>
      <span class="vol-title">${vol.name}</span>
    </div><div class="vol-body">`;

    if (vol.sections && vol.sections.length) {
      const bySec = {};
      matched.filter(a => a.sec).forEach(a => {
        (bySec[a.sec] = bySec[a.sec] || []).push(a);
      });
      Object.entries(bySec).forEach(([sn, arts]) => {
        html += `<div class="sec-lbl">${sn}</div>`;
        arts.forEach(a => { html += artLink(a); });
      });
      matched.filter(a => !a.sec).forEach(a => { html += artLink(a); });
    } else {
      matched.forEach(a => { html += artLink(a); });
    }

    html += `</div></div>`;
  });

  tocEl.innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text3)">无匹配结果</div>';
}

function artLink(a) {
  const active = a.id === curId ? ' active' : '';
  const read   = readSet.has(a.id) ? ' read' : '';
  return `<div class="art${active}${read}" id="al${a.id}" onclick="loadArt(${a.id})">
    <span class="art-n">${a.id}</span>
    <span style="flex:1">${a.title}</span>
    <span class="art-ck">✓</span>
  </div>`;
}

function toggleVol(vi) {
  document.querySelector(`.vol-item[data-vi="${vi}"]`)?.classList.toggle('open');
}

// Search
document.getElementById('searchBox').addEventListener('input', function() {
  renderToc(this.value);
});

// ── Load article ──────────────────────────────────────
function loadArt(id, scrollTop = true) {
  if (id === curId) { closeSidebar(); return; }
  curId = id;
  localStorage.setItem('last', id);

  document.querySelectorAll('.art').forEach(el => el.classList.remove('active'));
  const lnk = document.getElementById('al' + id);
  if (lnk) {
    lnk.classList.add('active');
    lnk.closest('.vol-item')?.classList.add('open');
    lnk.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  closeSidebar();
  if (scrollTop) document.getElementById('main').scrollTo({ top: 0, behavior: 'instant' });

  const wrap = document.getElementById('artWrap');

  if (EMBEDDED[id]) {
    renderProse(EMBEDDED[id], id, wrap);
  } else {
    const art = flatList.find(a => a.id === id);
    const idx = flatList.findIndex(a => a.id === id);
    const prev = idx > 0 ? flatList[idx - 1] : null;
    const next = idx < flatList.length - 1 ? flatList[idx + 1] : null;
    wrap.innerHTML = `
      <div class="noart">
        <div class="noart-star">★</div>
        <div class="noart-h">${art?.title || ''}</div>
        <div class="noart-p">此篇完整内容请在本地服务器中查阅<br>运行以下命令后访问 <strong>http://localhost:8080</strong></div>
        <code class="noart-cmd">python3 server.py</code>
      </div>
      <nav class="art-nav">
        <button class="nav-b" ${!prev ? 'disabled' : `onclick="loadArt(${prev.id})"`}>
          <span class="nav-lbl">← 上一篇</span>
          <span class="nav-ttl">${prev?.title || ''}</span>
        </button>
        <button class="nav-b nr" ${!next ? 'disabled' : `onclick="loadArt(${next.id})"`}>
          <span class="nav-lbl">下一篇 →</span>
          <span class="nav-ttl">${next?.title || ''}</span>
        </button>
      </nav>`;
    document.title = (art?.title || '读毛选') + ' — 读毛选';
  }

  readSet.add(id);
  localStorage.setItem('rd', JSON.stringify([...readSet]));
  updateStat();
  document.getElementById('al' + id)?.classList.add('read');
}

function renderProse(md, id, wrap) {
  const parts = md.split(/\n---+\n/);
  let html = marked.parse(parts[0]);
  if (parts[1]) html += `<div class="footnotes">${marked.parse(parts.slice(1).join('\n'))}</div>`;

  const idx = flatList.findIndex(a => a.id === id);
  const prev = idx > 0 ? flatList[idx - 1] : null;
  const next = idx < flatList.length - 1 ? flatList[idx + 1] : null;

  wrap.innerHTML = `
    <div class="prose">${html}</div>
    <nav class="art-nav">
      <button class="nav-b" ${!prev ? 'disabled' : `onclick="loadArt(${prev.id})"`}>
        <span class="nav-lbl">← 上一篇</span>
        <span class="nav-ttl">${prev?.title || ''}</span>
      </button>
      <button class="nav-b nr" ${!next ? 'disabled' : `onclick="loadArt(${next.id})"`}>
        <span class="nav-lbl">下一篇 →</span>
        <span class="nav-ttl">${next?.title || ''}</span>
      </button>
    </nav>`;

  const h1 = wrap.querySelector('h1');
  document.title = (h1 ? h1.textContent : '') + ' — 读毛选';
}

// ── Reading progress bar ──────────────────────────────
document.getElementById('main').addEventListener('scroll', function() {
  const max = this.scrollHeight - this.clientHeight;
  document.getElementById('rdFil').style.width = (max > 0 ? this.scrollTop / max * 100 : 0) + '%';
});

// ── Stats ─────────────────────────────────────────────
function updateStat() {
  const r = readSet.size, t = flatList.length;
  document.getElementById('statTxt').textContent = `已读 ${r} / ${t} 篇`;
  document.getElementById('sFill').style.width = t ? (r / t * 100) + '%' : '0%';
}

// ── Font ──────────────────────────────────────────────
function chFont(d) {
  fontSize = d === 0 ? 17 : Math.min(22, Math.max(13, fontSize + d));
  applyFz(fontSize);
  localStorage.setItem('fz', fontSize);
}

// ── Theme ─────────────────────────────────────────────
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  localStorage.setItem('theme', nxt);
  document.getElementById('themeBtn').textContent = nxt === 'dark' ? '☀ 日间' : '🌙 夜间';
}

// ── Mobile sidebar ────────────────────────────────────
document.getElementById('menuBtn').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('ovl').classList.toggle('on');
};
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('ovl').classList.remove('on');
}

// ── Keyboard ──────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !curId) return;
  const idx = flatList.findIndex(a => a.id === curId);
  if (e.key === 'ArrowLeft'  && idx > 0)                   loadArt(flatList[idx - 1].id);
  if (e.key === 'ArrowRight' && idx < flatList.length - 1) loadArt(flatList[idx + 1].id);
});

// ── Init ──────────────────────────────────────────────
buildFlat();
renderToc();
updateStat();
// Open to 反对自由主义 by default
const lastId = +localStorage.getItem('last');
loadArt(lastId && flatList.some(a => a.id === lastId) ? lastId : 21, false);
</script>
