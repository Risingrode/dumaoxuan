<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读毛选 — 毛泽东选集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ─────────────────────────────────── */
:root {
  --sb-w:     240px;
  --hdr-h:     48px;
  --ann-w:    340px;
  --reading-sz: 15px;

  /* Sidebar — always dark */
  --sb-bg:       #1c1c1e;
  --sb-hover:    #2c2c2e;
  --sb-active:   #3a3a3c;
  --sb-border:   #2c2c2e;
  --sb-text:     #e5e5ea;
  --sb-text-2:   #98989d;
  --sb-text-3:   #636366;
  --sb-accent:   #ffffff;

  /* Main — light */
  --bg:          #ffffff;
  --bg-2:        #f9f9f9;
  --text:        #09090b;
  --text-2:      #52525b;
  --text-3:      #a1a1aa;
  --border:      #e4e4e7;
  --border-2:    #f4f4f5;

  /* Header */
  --hdr-bg:      #ffffff;
  --hdr-border:  #e4e4e7;
  --hdr-text:    #09090b;
  --hdr-text-2:  #71717a;

  /* Blockquote */
  --bq-bg:       #f4f4f5;
  --bq-border:   #d4d4d8;

  /* Annotation */
  --ann-bg:      #ffffff;
  --ann-border:  #e4e4e7;
  --ann-active-bdr: #2563eb;
  --ann-active-bg:  rgba(37,99,235,.04);
  --ann-hover-bg:   rgba(0,0,0,.03);

  /* Progress */
  --prog:        #2563eb;
  --prog-dim:    rgba(37,99,235,.15);

  --shadow-sm:   0 1px 3px rgba(0,0,0,.08);
  --shadow-md:   0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:  -4px 0 24px rgba(0,0,0,.08);

  --radius:      8px;
  --ease:        cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg:          #18181b;
  --bg-2:        #1f1f23;
  --text:        #fafafa;
  --text-2:      #a1a1aa;
  --text-3:      #52525b;
  --border:      #27272a;
  --border-2:    #1f1f23;

  --hdr-bg:      #18181b;
  --hdr-border:  #27272a;
  --hdr-text:    #fafafa;
  --hdr-text-2:  #71717a;

  --bq-bg:       #27272a;
  --bq-border:   #3f3f46;

  --ann-bg:      #1f1f23;
  --ann-border:  #27272a;
  --ann-active-bg: rgba(37,99,235,.08);
  --ann-hover-bg:  rgba(255,255,255,.03);

  --sb-bg:       #111113;
  --sb-hover:    #1f1f23;
  --sb-active:   #27272a;
  --sb-border:   #1f1f23;
}

/* ── Reset ──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','Noto Sans SC','PingFang SC','Hiragino Sans GB',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  font-size:14px;
  transition:background .2s,color .2s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}

/* ── Header ─────────────────────────────────────────── */
.hdr{
  position:fixed;top:0;left:0;right:0;
  height:var(--hdr-h);
  background:var(--hdr-bg);
  border-bottom:1px solid var(--hdr-border);
  display:flex;align-items:center;
  padding:0 12px 0 4px;
  z-index:300;
  gap:4px;
}
.hdr-sb-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  color:var(--hdr-text-2);
  font-size:17px;
  transition:background .15s,color .15s;
  flex-shrink:0;
}
.hdr-sb-btn:hover{background:var(--border-2);color:var(--text)}
.hdr-brand{
  display:flex;align-items:baseline;
  gap:8px;
  padding:0 4px;
}
.hdr-title{
  font-size:15px;font-weight:600;
  letter-spacing:.02em;
  color:var(--text);
}
.hdr-subtitle{
  font-size:11px;color:var(--text-3);
  letter-spacing:.04em;
}
.hdr-spacer{flex:1}
.hdr-controls{display:flex;align-items:center;gap:6px}

.font-ctrl{
  display:flex;align-items:center;
  border:1px solid var(--border);
  border-radius:6px;overflow:hidden;
}
.font-ctrl button{
  padding:4px 9px;
  font-size:12px;color:var(--text-2);
  transition:background .15s,color .15s;
}
.font-ctrl button:hover{background:var(--border-2);color:var(--text)}

.theme-btn{
  padding:5px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:12px;color:var(--text-2);
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.theme-btn:hover{background:var(--border-2);color:var(--text)}

/* ── Sidebar ─────────────────────────────────────────── */
.sidebar{
  position:fixed;
  top:var(--hdr-h);left:0;
  width:var(--sb-w);
  height:calc(100vh - var(--hdr-h));
  background:var(--sb-bg);
  border-right:1px solid var(--sb-border);
  display:flex;flex-direction:column;
  z-index:200;
  overflow:hidden;
  transition:width .28s var(--ease);
}
.sidebar.collapsed{width:0}

.sb-search{
  padding:10px;
  border-bottom:1px solid var(--sb-border);
  flex-shrink:0;
}
.sb-input{
  width:100%;
  padding:7px 10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:6px;
  font-size:12.5px;
  color:var(--sb-text);
  outline:none;
  transition:border-color .2s,background .2s;
}
.sb-input::placeholder{color:var(--sb-text-3)}
.sb-input:focus{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.25);
}

.sb-stat{
  padding:6px 12px;
  font-size:11px;color:var(--sb-text-3);
  border-bottom:1px solid var(--sb-border);
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
  white-space:nowrap;
}
.sb-prog{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:1px}
.sb-prog-fill{height:100%;background:var(--sb-text-2);border-radius:1px;transition:width .4s}

.sb-toc{
  overflow-y:auto;flex:1;padding:4px 0 20px;
}
.sb-toc::-webkit-scrollbar{width:3px}
.sb-toc::-webkit-scrollbar-track{background:transparent}
.sb-toc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* Vol */
.vol-hdr{
  display:flex;align-items:center;
  padding:7px 10px;
  cursor:pointer;gap:6px;
  user-select:none;
  transition:background .12s;
}
.vol-hdr:hover{background:var(--sb-hover)}
.vol-arrow{
  width:14px;height:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;color:var(--sb-text-3);
  flex-shrink:0;
  transition:transform .18s;
}
.vol-item.open .vol-arrow{transform:rotate(90deg)}
.vol-num{
  font-size:10px;font-weight:600;
  color:var(--sb-text-3);
  flex-shrink:0;
  min-width:20px;
  font-variant-numeric:tabular-nums;
}
.vol-title{
  font-size:12px;font-weight:500;
  line-height:1.5;color:var(--sb-text);flex:1;
}
.vol-body{display:none}
.vol-item.open .vol-body{display:block}

/* Section */
.sec-hdr{
  padding:5px 10px 4px 28px;
  font-size:10.5px;font-weight:500;
  color:var(--sb-text-3);
  letter-spacing:.05em;
  text-transform:none;
  margin-top:3px;
}

/* Article link */
.art-lnk{
  display:flex;align-items:baseline;
  padding:4px 10px 4px 28px;
  font-size:12px;color:var(--sb-text-2);
  cursor:pointer;gap:6px;
  line-height:1.55;
  transition:background .1s,color .1s;
}
.art-lnk:hover{background:var(--sb-hover);color:var(--sb-text)}
.art-lnk.active{
  background:var(--sb-active);color:var(--sb-accent);
  font-weight:500;
}
.art-lnk.read:not(.active){color:var(--sb-text-3)}
.art-n{font-size:9.5px;opacity:.45;flex-shrink:0;font-variant-numeric:tabular-nums;min-width:20px}
.art-check{font-size:8px;flex-shrink:0;color:var(--sb-text-3);margin-left:auto;display:none}
.art-lnk.read:not(.active) .art-check{display:block}

/* ── Overlay ─────────────────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190}
.overlay.on{display:block}

/* ── Main ────────────────────────────────────────────── */
.main{
  margin-left:var(--sb-w);
  margin-top:var(--hdr-h);
  height:calc(100vh - var(--hdr-h));
  overflow-y:auto;
  transition:margin-left .28s var(--ease);
  position:relative;
}
.main.sb-off{margin-left:0}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.prog-bar{position:sticky;top:0;height:2px;background:var(--prog-dim);z-index:10}
.prog-fill{height:100%;background:var(--prog);width:0;transition:width .08s linear}

/* Art wrap */
.art-wrap{
  max-width:720px;
  margin:0 auto;
  padding:40px 48px 80px;
}

/* Welcome */
.welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:70vh;text-align:center;gap:12px;
}
.welcome-mark{
  width:56px;height:56px;border-radius:50%;
  background:var(--border-2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--text-3);
  margin-bottom:8px;
}
.welcome-h{font-size:22px;font-weight:600;letter-spacing:.03em}
.welcome-p{font-size:13.5px;color:var(--text-2);line-height:2;max-width:320px}

/* Loading */
.loading{
  display:flex;align-items:center;justify-content:center;
  min-height:50vh;color:var(--text-3);font-size:13px;
}

/* ── Prose ───────────────────────────────────────────── */
.prose{
  font-family:'Noto Serif SC','SimSun','宋体',Georgia,serif;
  font-size:var(--reading-sz);
  line-height:2;
  color:var(--text);
}
.prose h1{
  font-size:1.5em;font-weight:700;
  line-height:1.4;margin-bottom:.25em;
  font-family:'Noto Serif SC',serif;
  letter-spacing:.04em;
}
.prose h2{
  font-size:1.15em;font-weight:600;
  margin-top:2em;margin-bottom:.7em;
  padding-bottom:.3em;
  border-bottom:1px solid var(--border);
}
.prose h3{font-size:1.05em;font-weight:600;margin-top:1.6em;margin-bottom:.5em}
.prose h1+p{text-indent:0;color:var(--text-2);font-size:.88em;margin-bottom:1.2em}
.prose p{margin-bottom:.9em;text-indent:2em}
.prose h2+p,.prose h3+p,.prose blockquote+p,.prose hr+p{text-indent:0}

.prose blockquote{
  background:var(--bq-bg);
  border-left:3px solid var(--bq-border);
  padding:10px 16px;margin:1.2em 0;
  border-radius:0 6px 6px 0;
  font-size:.88em;color:var(--text-2);
}
.prose blockquote p{text-indent:0;margin-bottom:.5em}
.prose blockquote p:last-child{margin-bottom:0}
.prose hr{border:none;border-top:1px solid var(--border);margin:2.2em 0 1.8em}
.prose .footnotes{
  font-size:.8em;color:var(--text-3);
  line-height:1.85;
  border-top:1px solid var(--border);
  margin-top:2.5em;padding-top:1.5em;
}
.prose .footnotes p{text-indent:0;margin-bottom:.7em}
.prose strong{font-weight:700}
.prose em{font-style:normal;color:var(--text-2)}
.prose ul,.prose ol{padding-left:2em;margin-bottom:.9em}
.prose li{margin-bottom:.3em}

/* ── Article meta panel ─────────────────────────────── */
.art-meta{
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:2em;
  overflow:hidden;
  font-family:'Inter','Noto Sans SC',sans-serif;
}
.art-meta-hdr{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;user-select:none;
  background:var(--bg-2);
  transition:background .15s;
}
.art-meta-hdr:hover{background:var(--border-2)}
.art-meta-icon{font-size:14px;line-height:1;color:var(--text-3)}
.art-meta-title{font-size:12.5px;font-weight:500;color:var(--text-2);flex:1}
.art-meta-arrow{font-size:8px;color:var(--text-3);transition:transform .18s}
.art-meta.open .art-meta-arrow{transform:rotate(90deg)}
.art-meta-body{display:none;padding:14px 16px;border-top:1px solid var(--border)}
.art-meta.open .art-meta-body{display:block}
.art-meta-sect{margin-bottom:14px}
.art-meta-sect:last-child{margin-bottom:0}
.art-meta-sect-label{
  font-size:10px;font-weight:600;
  color:var(--text-3);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:6px;
}
.art-meta-sect-text{font-size:13px;color:var(--text-2);line-height:1.9}
.art-meta-events{list-style:none;padding:0}
.art-meta-events li{
  font-size:12.5px;color:var(--text-2);
  padding:2px 0 2px 14px;line-height:1.7;position:relative;
}
.art-meta-events li::before{
  content:'';position:absolute;left:0;top:.7em;
  width:4px;height:4px;border-radius:50%;
  background:var(--text-3);
}

/* ── Annotated paragraphs ───────────────────────────── */
.para-block{position:relative}
.para-block.has-ann>p{
  cursor:pointer;
  border-left:2px solid transparent;
  padding-left:10px;
  margin-left:-12px;
  transition:border-color .15s,background .15s;
}
.para-block.has-ann>p:hover{
  background:var(--ann-hover-bg);
  border-left-color:var(--border);
}
.para-block.has-ann.active>p{
  background:var(--ann-active-bg);
  border-left-color:var(--ann-active-bdr);
}

/* Annotation tip banner */
.ann-tip{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:6px;
  font-size:12px;color:var(--text-3);
  margin-bottom:1.6em;
  font-family:'Inter','Noto Sans SC',sans-serif;
}

/* ── Right annotation panel ─────────────────────────── */
.ann-panel{
  position:fixed;
  right:0;
  top:var(--hdr-h);
  bottom:0;
  width:var(--ann-w);
  background:var(--ann-bg);
  border-left:1px solid var(--ann-border);
  box-shadow:var(--shadow-lg);
  z-index:100;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform .25s var(--ease);
  overflow:hidden;
}
.ann-panel.open{transform:translateX(0)}

.ann-panel-top{
  display:flex;align-items:center;
  padding:12px 16px;
  border-bottom:1px solid var(--ann-border);
  flex-shrink:0;
  gap:8px;
}
.ann-panel-label{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;
  color:var(--text);
}
.ann-panel-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--ann-active-bdr);flex-shrink:0;
}
.ann-panel-close{
  margin-left:auto;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;color:var(--text-3);font-size:14px;
  transition:background .15s,color .15s;
}
.ann-panel-close:hover{background:var(--border-2);color:var(--text)}

.ann-panel-scroll{
  overflow-y:auto;flex:1;
}
.ann-panel-scroll::-webkit-scrollbar{width:4px}
.ann-panel-scroll::-webkit-scrollbar-track{background:transparent}
.ann-panel-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Annotation sections */
.ann-sec{
  padding:16px 18px;
  border-bottom:1px solid var(--ann-border);
}
.ann-sec:last-child{border-bottom:none}
.ann-sec-label{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:9px;
}
.ann-sec-label svg{opacity:.7}
.ann-sec-text{
  font-size:13px;color:var(--text-2);
  line-height:1.9;
  font-family:'Inter','Noto Sans SC',sans-serif;
}

/* ── Article navigation ─────────────────────────────── */
.art-nav{
  display:flex;justify-content:space-between;
  margin-top:48px;padding-top:20px;
  border-top:1px solid var(--border);gap:12px;
}
.nav-btn{
  display:flex;flex-direction:column;justify-content:center;
  padding:10px 14px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text-2);font-size:12.5px;
  transition:all .18s;max-width:46%;text-align:left;line-height:1.5;
}
.nav-btn.r{text-align:right}
.nav-btn:hover:not(:disabled){
  background:var(--text);color:var(--bg);border-color:var(--text);
}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-lbl{font-size:10px;opacity:.6;display:block;margin-bottom:2px}
.nav-ttl{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}

/* ── Card mode overlay ───────────────────────────────── */
.card-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:500;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .3s var(--ease);
}
.card-overlay.open{transform:translateY(0)}

.card-hdr{
  height:var(--hdr-h);
  display:flex;align-items:center;
  padding:0 16px;gap:12px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.card-back{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--text-2);
  padding:6px 10px;border-radius:6px;
  transition:background .15s,color .15s;
}
.card-back:hover{background:var(--bg-2);color:var(--text)}
.card-hdr-title{font-size:13.5px;font-weight:600;color:var(--text);flex:1}
.card-prog{
  font-size:12px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}

.card-body{
  flex:1;overflow-y:auto;
  display:flex;align-items:flex-start;justify-content:center;
  padding:32px 20px 40px;
}
.card-inner{
  width:100%;max-width:680px;
  display:flex;flex-direction:column;gap:16px;
}

.card-type-badge{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:600;
  letter-spacing:.08em;
  color:var(--acc,#2563eb);
  background:rgba(37,99,235,.08);
  padding:3px 10px;border-radius:20px;
  align-self:flex-start;
}
.card-scene{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 20px;
  font-size:14px;color:var(--text-2);
  line-height:1.85;
}
.card-scene-label{
  font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;
}
.card-question{
  font-size:16px;font-weight:600;
  color:var(--text);line-height:1.6;
  font-family:'Inter','Noto Serif SC',sans-serif;
  padding:4px 0;
}

.card-answer-wrap{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-answer-placeholder{
  display:flex;flex-direction:column;align-items:center;
  padding:32px 20px;gap:12px;
  cursor:pointer;
  transition:background .15s;
}
.card-answer-placeholder:hover{background:var(--bg-2)}
.card-show-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--text);color:var(--bg);
  padding:10px 24px;border-radius:7px;
  font-size:13.5px;font-weight:500;
  transition:opacity .15s;
}
.card-show-btn:hover{opacity:.85}
.card-show-hint{font-size:12px;color:var(--text-3)}

.card-answer{
  display:none;
  padding:20px;
  font-size:13.5px;color:var(--text-2);
  line-height:1.9;
  font-family:'Inter','Noto Sans SC',sans-serif;
}
.card-answer.revealed{display:block}
.card-answer strong{color:var(--text);font-weight:600}

.card-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.card-nav-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:7px;
  font-size:13px;color:var(--text-2);
  border:1px solid var(--border);
  background:var(--bg);
  transition:all .15s;
}
.card-nav-btn:hover:not(:disabled){
  background:var(--text);color:var(--bg);border-color:var(--text);
}
.card-nav-btn:disabled{opacity:.3;cursor:not-allowed}
.card-dots{
  display:flex;gap:6px;
}
.card-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--border);
  transition:background .15s,transform .15s;
}
.card-dot.active{background:var(--ann-active-bdr);transform:scale(1.3)}

/* Cards available tip */
.cards-tip{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:6px;
  font-size:12px;color:var(--text-3);
  font-family:'Inter','Noto Sans SC',sans-serif;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  margin-bottom:1.6em;
}
.cards-tip:hover{border-color:var(--ann-active-bdr);background:var(--ann-active-bg);color:var(--text)}
.cards-tip-icon{font-size:14px}

/* ── Responsive ─────────────────────────────────────── */
@media(max-width:900px){
  .ann-panel{width:min(var(--ann-w),90vw)}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:var(--sb-w)!important}
  .sidebar.open{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  .main{margin-left:0!important}
  .art-wrap{padding:28px 20px 60px}
  .hdr-subtitle{display:none}
  .ann-panel{width:100vw;top:auto;height:65vh;transform:translateY(100%);border-left:none;border-top:1px solid var(--ann-border)}
  .ann-panel.open{transform:translateY(0)}
}
@media(max-width:480px){
  .font-ctrl{display:none}
  .nav-ttl{max-width:120px}
}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr" id="hdr">
  <button class="hdr-sb-btn" id="sbToggle" onclick="toggleSidebar()" title="切换侧栏">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <rect x="1" y="3" width="14" height="1.5" rx=".75"/>
      <rect x="1" y="7.25" width="14" height="1.5" rx=".75"/>
      <rect x="1" y="11.5" width="14" height="1.5" rx=".75"/>
    </svg>
  </button>
  <div class="hdr-brand">
    <span class="hdr-title">读毛选</span>
    <span class="hdr-subtitle">毛泽东选集</span>
  </div>
  <div class="hdr-spacer"></div>
  <div class="hdr-controls">
    <div class="font-ctrl">
      <button onclick="chFont(-1)" title="缩小">A−</button>
      <button onclick="chFont(0)"  title="重置">A</button>
      <button onclick="chFont(1)"  title="放大">A+</button>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">暗色</button>
  </div>
</header>

<!-- Mobile overlay -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sb-search">
    <input class="sb-input" id="searchBox" type="text" placeholder="搜索篇目…" autocomplete="off">
  </div>
  <div class="sb-stat">
    <span id="statText">加载中…</span>
    <div class="sb-prog"><div class="sb-prog-fill" id="statFill"></div></div>
  </div>
  <div class="sb-toc" id="toc">
    <div style="padding:20px 12px;color:var(--sb-text-3);font-size:12px">目录加载中…</div>
  </div>
</aside>

<!-- Main reading area -->
<main class="main" id="main">
  <div class="prog-bar"><div class="prog-fill" id="readFill"></div></div>
  <div class="art-wrap" id="artWrap">
    <div class="welcome">
      <div class="welcome-mark">文</div>
      <div class="welcome-h">毛泽东选集</div>
      <div class="welcome-p">
        收录官方五卷及非官方二卷，共七卷。<br>
        从左侧目录选择篇目开始阅读。<br><br>
        带注解的篇目，点击段落可在右侧<br>查看通俗注解、历史背景与小故事。
      </div>
    </div>
  </div>
</main>

<!-- Card mode overlay -->
<div class="card-overlay" id="cardOverlay">
  <div class="card-hdr">
    <button class="card-back" onclick="closeCards()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
      返回
    </button>
    <span class="card-hdr-title" id="cardTitle">情景练习</span>
    <span class="card-prog" id="cardProg"></span>
  </div>
  <div class="card-body">
    <div class="card-inner" id="cardInner"></div>
  </div>
  <div class="card-footer">
    <button class="card-nav-btn" id="cardPrev" onclick="prevCard()" disabled>← 上一题</button>
    <div class="card-dots" id="cardDots"></div>
    <button class="card-nav-btn" id="cardNext" onclick="nextCard()">下一题 →</button>
  </div>
</div>

<!-- Right annotation panel -->
<aside class="ann-panel" id="annPanel">
  <div class="ann-panel-top">
    <div class="ann-panel-label">
      <span class="ann-panel-dot"></span>
      段落注解
    </div>
    <button class="ann-panel-close" onclick="closeAnnPanel()" title="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
        <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="ann-panel-scroll" id="annPanelBody"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────
let toc       = [];
let volCache  = {};
let flatList  = [];
let curId     = null;
let curAnnotations = null;
let fontSize  = +localStorage.getItem('fz') || 15;
let readSet   = new Set(JSON.parse(localStorage.getItem('rd') || '[]'));
let searchVer = 0;
let sbOpen    = true;
let cardIds   = new Set();
let curCards  = [];
let curCardIdx = 0;

// ── Boot ───────────────────────────────────────────────
applyTheme(localStorage.getItem('theme') || 'light');
setFontSize(fontSize);
marked.setOptions({ breaks: true, gfm: true });

// Restore sidebar state
if (localStorage.getItem('sb') === '0') {
  sbOpen = false;
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('main').classList.add('sb-off');
}

// ── Init ───────────────────────────────────────────────
async function init() {
  try {
    const [tocRes, artsRes, cardsListRes] = await Promise.all([
      fetch('/api/toc'),
      fetch('/api/articles'),
      fetch('/api/cards/list')
    ]);
    toc      = await tocRes.json();
    flatList = await artsRes.json();
    cardIds  = new Set(await cardsListRes.json());
    renderToc();
    updateStat();
    const last = +localStorage.getItem('last');
    if (last && flatList.some(a => a.id === last)) loadArt(last, false);
  } catch(e) {
    document.getElementById('toc').innerHTML =
      '<div style="padding:20px 12px;color:var(--sb-text-3);font-size:12px">加载失败，请刷新</div>';
  }
}

// ── Sidebar toggle ─────────────────────────────────────
function toggleSidebar() {
  sbOpen = !sbOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sbOpen);
  document.getElementById('main').classList.toggle('sb-off', !sbOpen);
  // on mobile, use open class
  document.getElementById('sidebar').classList.toggle('open', sbOpen && window.innerWidth <= 768);
  document.getElementById('overlay').classList.toggle('on', sbOpen && window.innerWidth <= 768);
  localStorage.setItem('sb', sbOpen ? '1' : '0');
}

function closeSidebar() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('on');
  }
}

// ── Right annotation panel ─────────────────────────────
function showAnnPanel(ann) {
  let html = '';

  if (ann.note) {
    html += `<div class="ann-sec">
      <div class="ann-sec-label">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="5" r="4"/><line x1="5" y1="3.5" x2="5" y2="5.5"/><line x1="5" y1="6.8" x2="5" y2="7"/></svg>
        通俗注解
      </div>
      <div class="ann-sec-text">${escHtml(ann.note)}</div>
    </div>`;
  }
  if (ann.bg) {
    html += `<div class="ann-sec">
      <div class="ann-sec-label">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="8" height="8" rx="1"/><line x1="3" y1="4" x2="7" y2="4"/><line x1="3" y1="6" x2="6" y2="6"/></svg>
        历史背景 · 党史
      </div>
      <div class="ann-sec-text">${escHtml(ann.bg)}</div>
    </div>`;
  }
  if (ann.story) {
    html += `<div class="ann-sec">
      <div class="ann-sec-label">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8 Q5 2 9 8"/><line x1="5" y1="4" x2="5" y2="7"/></svg>
        小故事 · 例子
      </div>
      <div class="ann-sec-text">${escHtml(ann.story)}</div>
    </div>`;
  }

  document.getElementById('annPanelBody').innerHTML = html;
  document.getElementById('annPanel').classList.add('open');
}

function closeAnnPanel() {
  document.getElementById('annPanel').classList.remove('open');
  document.querySelectorAll('.para-block.has-ann.active')
    .forEach(el => el.classList.remove('active'));
}

// ── Render TOC skeleton ────────────────────────────────
function renderToc(filter = '') {
  const q = filter.trim();
  if (q) { renderTocSearch(q); return; }

  const tocEl = document.getElementById('toc');
  let html = '';

  toc.forEach((vol, vi) => {
    const isCurVol = volCache[vi] && getVolArts(volCache[vi]).some(a => a.id === curId);
    const isOpen   = (vi === 0) || isCurVol;

    html += `<div class="vol-item${isOpen ? ' open' : ''}" data-vi="${vi}">
      <div class="vol-hdr" onclick="toggleVol(${vi})">
        <span class="vol-arrow">▶</span>
        <span class="vol-num">${vi + 1}</span>
        <span class="vol-title">${vol.name}</span>
      </div>
      <div class="vol-body" id="volBody${vi}"></div>
    </div>`;
  });

  tocEl.innerHTML = html ||
    '<div style="padding:20px 12px;color:var(--sb-text-3);font-size:12px">无匹配</div>';

  toc.forEach((_, vi) => {
    if (document.querySelector(`.vol-item[data-vi="${vi}"]`)?.classList.contains('open'))
      loadVolume(vi);
  });
}

async function loadVolume(vi) {
  if (volCache[vi]) { renderVolBody(vi); return; }
  const body = document.getElementById('volBody' + vi);
  if (body) body.innerHTML =
    '<div style="padding:6px 28px;color:var(--sb-text-3);font-size:11px">加载中…</div>';
  try {
    const res = await fetch(`/api/toc/volume?vi=${vi}`);
    volCache[vi] = await res.json();
    renderVolBody(vi);
  } catch(e) {
    if (body) body.innerHTML =
      '<div style="padding:6px 28px;color:var(--sb-text-3);font-size:11px">加载失败</div>';
  }
}

function renderVolBody(vi) {
  const vol  = volCache[vi];
  const body = document.getElementById('volBody' + vi);
  if (!vol || !body) return;
  let html = '';
  if (vol.sections?.length) {
    vol.sections.forEach(sec => {
      if (!sec.articles?.length) return;
      html += `<div class="sec-hdr">${sec.name}</div>`;
      sec.articles.forEach(a => { html += artLink(a); });
    });
    (vol.articles || []).forEach(a => { html += artLink(a); });
  } else {
    (vol.articles || []).forEach(a => { html += artLink(a); });
  }
  body.innerHTML = html;
}

async function renderTocSearch(q) {
  const ver = ++searchVer;
  const tocEl = document.getElementById('toc');
  tocEl.innerHTML =
    '<div style="padding:20px 12px;color:var(--sb-text-3);font-size:12px">搜索中…</div>';

  await Promise.all(toc.map((_, vi) => loadVolume(vi)));
  if (ver !== searchVer) return;

  let html = '';
  toc.forEach((vol, vi) => {
    const fv = volCache[vi];
    if (!fv) return;
    const matched = [];
    (fv.sections || []).forEach(sec =>
      (sec.articles || []).forEach(a => {
        if (a.title.includes(q) || vol.name.includes(q) || sec.name.includes(q))
          matched.push({ ...a, _sec: sec.name });
      })
    );
    (fv.articles || []).forEach(a => {
      if (a.title.includes(q) || vol.name.includes(q)) matched.push(a);
    });
    if (!matched.length) return;

    html += `<div class="vol-item open" data-vi="${vi}">
      <div class="vol-hdr" onclick="toggleVol(${vi})">
        <span class="vol-arrow">▶</span>
        <span class="vol-num">${vi+1}</span>
        <span class="vol-title">${vol.name}</span>
      </div>
      <div class="vol-body" id="volBody${vi}">`;

    if (fv.sections?.length) {
      const bySec = {};
      matched.filter(a => a._sec).forEach(a => {
        (bySec[a._sec] = bySec[a._sec] || []).push(a);
      });
      Object.entries(bySec).forEach(([s, arts]) => {
        html += `<div class="sec-hdr">${s}</div>`;
        arts.forEach(a => { html += artLink(a); });
      });
      matched.filter(a => !a._sec).forEach(a => { html += artLink(a); });
    } else {
      matched.forEach(a => { html += artLink(a); });
    }
    html += `</div></div>`;
  });

  tocEl.innerHTML = html ||
    '<div style="padding:20px 12px;color:var(--sb-text-3);font-size:12px">无匹配</div>';
}

function getVolArts(vol) {
  const arts = [];
  (vol.sections || []).forEach(s => arts.push(...(s.articles || [])));
  arts.push(...(vol.articles || []));
  return arts;
}

function artLink(a) {
  const active = a.id === curId   ? ' active' : '';
  const read   = readSet.has(a.id) ? ' read'   : '';
  return `<div class="art-lnk${active}${read}" id="al${a.id}" onclick="loadArt(${a.id})">
    <span class="art-n">${a.id}</span>
    <span style="flex:1">${a.title}</span>
    <span class="art-check">✓</span>
  </div>`;
}

async function toggleVol(vi) {
  const item = document.querySelector(`.vol-item[data-vi="${vi}"]`);
  if (!item) return;
  const wasOpen = item.classList.contains('open');
  item.classList.toggle('open');
  if (!wasOpen) await loadVolume(vi);
}

document.getElementById('searchBox').addEventListener('input', function() {
  renderToc(this.value);
});

// ── Load article ───────────────────────────────────────
async function loadArt(id, scrollTop = true) {
  if (id === curId) { closeSidebar(); return; }
  curId = id;
  curAnnotations = null;
  closeAnnPanel();
  closeCards();
  localStorage.setItem('last', id);

  const vi = toc.findIndex((_, i) =>
    volCache[i] && getVolArts(volCache[i]).some(a => a.id === id)
  );
  if (vi === -1) {
    for (let i = 0; i < toc.length; i++) {
      if (!volCache[i]) await loadVolume(i);
      if (getVolArts(volCache[i]).some(a => a.id === id)) break;
    }
  }

  document.querySelectorAll('.art-lnk').forEach(el => el.classList.remove('active'));
  const lnk = document.getElementById('al' + id);
  if (lnk) {
    lnk.classList.add('active');
    lnk.closest('.vol-item')?.classList.add('open');
    lnk.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    for (let i = 0; i < toc.length; i++) {
      if (volCache[i] && getVolArts(volCache[i]).some(a => a.id === id)) {
        const item = document.querySelector(`.vol-item[data-vi="${i}"]`);
        if (item) { item.classList.add('open'); renderVolBody(i); }
        const l2 = document.getElementById('al' + id);
        if (l2) { l2.classList.add('active'); l2.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        break;
      }
    }
  }

  const wrap = document.getElementById('artWrap');
  wrap.innerHTML = '<div class="loading">加载中…</div>';
  if (scrollTop) document.getElementById('main').scrollTo({ top: 0 });
  closeSidebar();

  try {
    const [artRes, annRes] = await Promise.all([
      fetch('/api/article?id=' + id),
      fetch('/api/annotations?id=' + id)
    ]);
    const d       = await artRes.json();
    const annData = await annRes.json();
    curAnnotations = annData;
    renderArticle(d.content, id, annData);
    readSet.add(id);
    localStorage.setItem('rd', JSON.stringify([...readSet]));
    updateStat();
    const al = document.getElementById('al' + id);
    if (al) al.classList.add('read');
  } catch(e) {
    wrap.innerHTML = '<div class="loading" style="color:var(--text-3)">加载失败</div>';
  }
}

// ── Render article ─────────────────────────────────────
function renderArticle(md, id, annData) {
  const parts  = md.split(/\n---+\n/);
  let bodyHtml = marked.parse(parts[0]);
  if (parts.slice(1).join('\n').trim())
    bodyHtml += `<div class="prose-fn">${marked.parse(parts.slice(1).join('\n'))}</div>`;

  bodyHtml = injectAnnotations(bodyHtml, annData);

  const idx  = flatList.findIndex(a => a.id === id);
  const prev = idx > 0 ? flatList[idx - 1] : null;
  const next = idx < flatList.length - 1 ? flatList[idx + 1] : null;

  const metaHtml  = annData?.meta ? buildMetaPanel(annData.meta) : '';
  const tipHtml   = annData?.paragraphs?.length
    ? `<div class="ann-tip">点击段落可在右侧查看注解 · 历史背景 · 小故事</div>`
    : '';
  const cardsTipHtml = cardIds.has(id)
    ? `<div class="cards-tip" onclick="openCards(${id})">
        <span class="cards-tip-icon">🃏</span>
        <span>本篇有情景分析练习，点击开始</span>
      </div>`
    : '';

  document.getElementById('artWrap').innerHTML = `
    ${metaHtml}
    ${tipHtml}
    ${cardsTipHtml}
    <div class="prose">${bodyHtml}</div>
    <nav class="art-nav">
      <button class="nav-btn"${!prev ? ' disabled' : ` onclick="loadArt(${prev.id})"`}>
        <span class="nav-lbl">← 上一篇</span>
        <span class="nav-ttl">${prev ? prev.title : ''}</span>
      </button>
      <button class="nav-btn r"${!next ? ' disabled' : ` onclick="loadArt(${next.id})"`}>
        <span class="nav-lbl">下一篇 →</span>
        <span class="nav-ttl">${next ? next.title : ''}</span>
      </button>
    </nav>`;

  const h1 = document.querySelector('.prose h1');
  document.title = (h1 ? h1.textContent : '文章') + ' — 读毛选';
}

// ── Inject paragraph affordance (no inline card) ───────
function injectAnnotations(html, annData) {
  if (!annData?.paragraphs?.length) return html;
  const parser    = new DOMParser();
  const doc       = parser.parseFromString(`<div>${html}</div>`, 'text/html');
  const container = doc.body.firstChild;

  container.querySelectorAll('p').forEach(p => {
    const txt = p.textContent.trim();
    const ann = annData.paragraphs.find(a => txt.startsWith(a.match));
    if (!ann) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'para-block has-ann';
    p.parentNode.insertBefore(wrapper, p);
    wrapper.appendChild(p);
    // annotation shown in right panel via delegated handler below
  });

  return container.innerHTML;
}

// Delegated handler — survives innerHTML replacement
document.getElementById('artWrap').addEventListener('click', e => {
  const p = e.target.closest('p');
  if (!p) return;
  const wrapper = p.parentElement;
  if (!wrapper?.classList.contains('has-ann')) return;

  const txt = p.textContent.trim();
  const ann = curAnnotations?.paragraphs?.find(a => txt.startsWith(a.match));
  if (!ann) return;

  // Highlight active paragraph
  document.querySelectorAll('.para-block.has-ann.active')
    .forEach(el => el.classList.remove('active'));
  wrapper.classList.add('active');

  showAnnPanel(ann);
});

// ── Card mode ──────────────────────────────────────────
async function openCards(id) {
  try {
    const res = await fetch('/api/cards?id=' + id);
    curCards   = await res.json();
    curCardIdx = 0;
    if (!curCards.length) return;
    const title = flatList.find(a => a.id === id)?.title || '情景练习';
    document.getElementById('cardTitle').textContent = title;
    renderCard();
    document.getElementById('cardOverlay').classList.add('open');
  } catch(e) {}
}

function closeCards() {
  document.getElementById('cardOverlay').classList.remove('open');
}

function renderCard() {
  const card  = curCards[curCardIdx];
  const total = curCards.length;
  const idx   = curCardIdx;

  document.getElementById('cardProg').textContent = `${idx + 1} / ${total}`;
  document.getElementById('cardPrev').disabled = idx === 0;
  document.getElementById('cardNext').disabled = idx === total - 1;

  const dots = Array.from({length: total}, (_, i) =>
    `<div class="card-dot${i === idx ? ' active' : ''}"></div>`
  ).join('');
  document.getElementById('cardDots').innerHTML = dots;

  document.getElementById('cardInner').innerHTML = `
    <div class="card-type-badge">${escHtml(card.type || '情景')}</div>
    <div class="card-scene">
      <div class="card-scene-label">背景情景</div>
      ${escHtml(card.scene)}
    </div>
    <div class="card-question">${escHtml(card.q)}</div>
    <div class="card-answer-wrap">
      <div class="card-answer-placeholder" id="cardAnsPlaceholder" onclick="showAnswer()">
        <div class="card-show-btn">显示答案</div>
        <div class="card-show-hint">思考后点击查看分析解法</div>
      </div>
      <div class="card-answer" id="cardAnsText">${escHtml(card.a)}</div>
    </div>`;
}

function showAnswer() {
  document.getElementById('cardAnsPlaceholder').style.display = 'none';
  document.getElementById('cardAnsText').classList.add('revealed');
}

function nextCard() {
  if (curCardIdx < curCards.length - 1) { curCardIdx++; renderCard(); }
}

function prevCard() {
  if (curCardIdx > 0) { curCardIdx--; renderCard(); }
}

// ── Meta panel ─────────────────────────────────────────
function buildMetaPanel(meta) {
  const evHtml = meta.events?.length
    ? `<div class="art-meta-sect">
        <div class="art-meta-sect-label">相关历史事件</div>
        <ul class="art-meta-events">${meta.events.map(e => `<li>${escHtml(e)}</li>`).join('')}</ul>
      </div>` : '';

  return `<div class="art-meta" id="artMetaPanel">
    <div class="art-meta-hdr" onclick="toggleMeta()">
      <span class="art-meta-icon">◉</span>
      <span class="art-meta-title">写作背景 · 党史意义 · 历史事件</span>
      <span class="art-meta-arrow">▶</span>
    </div>
    <div class="art-meta-body">
      ${meta.context ? `<div class="art-meta-sect">
        <div class="art-meta-sect-label">写作背景</div>
        <div class="art-meta-sect-text">${escHtml(meta.context)}</div>
      </div>` : ''}
      ${meta.party_history ? `<div class="art-meta-sect">
        <div class="art-meta-sect-label">党史意义</div>
        <div class="art-meta-sect-text">${escHtml(meta.party_history)}</div>
      </div>` : ''}
      ${evHtml}
    </div>
  </div>`;
}

function toggleMeta() {
  document.getElementById('artMetaPanel')?.classList.toggle('open');
}

// ── Utilities ──────────────────────────────────────────
function escHtml(s) {
  return (s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function updateStat() {
  const t = flatList.length, r = readSet.size;
  document.getElementById('statText').textContent = `已读 ${r} / ${t}`;
  document.getElementById('statFill').style.width = t ? (r/t*100)+'%' : '0%';
}

document.getElementById('main').addEventListener('scroll', function() {
  const max = this.scrollHeight - this.clientHeight;
  const pct = max > 0 ? this.scrollTop / max * 100 : 0;
  document.getElementById('readFill').style.width = pct + '%';
});

function chFont(d) {
  if (d === 0) fontSize = 15;
  else fontSize = Math.min(20, Math.max(12, fontSize + d));
  setFontSize(fontSize);
  localStorage.setItem('fz', fontSize);
}
function setFontSize(sz) {
  document.documentElement.style.setProperty('--reading-sz', sz + 'px');
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = t === 'dark' ? '亮色' : '暗色';
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !curId) return;
  const idx = flatList.findIndex(a => a.id === curId);
  if (e.key === 'ArrowLeft'  && idx > 0)                   loadArt(flatList[idx-1].id);
  if (e.key === 'ArrowRight' && idx < flatList.length - 1) loadArt(flatList[idx+1].id);
  if (e.key === 'Escape') { closeAnnPanel(); closeCards(); }
});

// ── Start ──────────────────────────────────────────────
init();
</script>
</body>
</html>
